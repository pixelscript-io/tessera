name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The docs check (every sample compiles, every link resolves) gates the deploy. The axe scan runs in `pnpm run ci`.
      - run: pnpm --filter website generate
      - run: pnpm --filter website check
      - run: pnpm --filter website exec vitepress build content
      # Wrangler runs through npx, outside the workspace: the action's own npm install fails on `workspace:*` dependencies.
      - run: npx --yes wrangler@4 deploy --config website/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
