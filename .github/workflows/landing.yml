name: Deploy landing page

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: landing-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The page is built with Tessera, so the compiler checks it before it ships: a style off the tokens, or a
      # component used wrongly, stops the deploy.
      - run: pnpm landing:check
      - run: pnpm landing:build
      # Wrangler runs through npx, outside the workspace: the action's own npm install fails on `workspace:*` dependencies.
      - run: npx --yes wrangler@4 deploy --config landing/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
